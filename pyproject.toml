[tool.poetry]
name = "himut"
version = "1.0.4"
description = "himut: single molecule somatic single-base substitution detection using PacBio CCS reads"
authors = ["Sangjin Lee <sjinlee666@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/sjin09/himut"
repository = "https://github.com/sjin09/himut"
classifiers = [
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

[tool.poetry.urls]
Changelog = "https://github.com/sjin09/himut/releases"

[tool.poetry.dependencies]
python = ">=3.9,<3.10"
argparse = "^1.4.0"
natsort = "^8.0.0"
numpy = "^1.20.2"
plotnine = "^0.9.0"
psutil = "^5.8.0"
pysam = "^0.18.0"

[tool.poetry.dev-dependencies]
flake8 = { version = "^6.1" }
black = { version = "^23.10" } 
pytest = { version = "^7.4.3" }

[tool.poetry.extras]
dev = ["flake8", "black", "pytest"]

[tool.poetry.scripts]
himut = "himut.__main__:main"

[tool.coverage.paths]
source = ["src", "*/site-packages"]

[tool.coverage.run]
branch = true
source = ["himut"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.black]
line-length = 120

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
